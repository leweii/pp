---
layout: default
title: Home
---

<div class="gallery">
  {% for post in site.posts %}
    {% if post.images %}
      {% assign first_image = post.images[0] %}
      <figure class="gallery-item">
        <a href="{{ post.url | relative_url }}">
          <img
            src="{% include image-url.html src=first_image %}"
            alt="{{ post.title }}"
            class="lazy-image"
            loading="lazy"
          >
          <figcaption class="gallery-caption">
            <h3 class="gallery-title">{{ post.title }}</h3>
            {% if post.excerpt %}
            <p class="gallery-excerpt">{{ post.excerpt | strip_html | truncate: 80 }}</p>
            {% endif %}
          </figcaption>
        </a>
      </figure>
    {% endif %}
  {% endfor %}
</div>
